name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  A0_FRAMEWORK_ROOT: /tmp/a0-framework
  PYTHONPATH: /tmp/a0-framework:${{ github.workspace }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov PyYAML

      - name: Provide the Agent Zero extension test shim
        shell: bash
        run: |
          mkdir -p "$A0_FRAMEWORK_ROOT/helpers"
          touch "$A0_FRAMEWORK_ROOT/helpers/__init__.py"

          cat > "$A0_FRAMEWORK_ROOT/helpers/extension.py" <<'PY'
          class Extension:
              def __init__(self, agent=None):
                  self.agent = agent
          PY

          cat > "$A0_FRAMEWORK_ROOT/helpers/modules.py" <<'PY'
          import importlib.util
          from pathlib import Path

          def load_classes_from_folder(folder, _pattern, base_class):
              classes = []
              for path in Path(folder).glob("*.py"):
                  spec = importlib.util.spec_from_file_location(path.stem, path)
                  module = importlib.util.module_from_spec(spec)
                  if spec and spec.loader:
                      spec.loader.exec_module(module)
                  classes.extend(
                      value for value in vars(module).values()
                      if isinstance(value, type)
                      and issubclass(value, base_class)
                      and value is not base_class
                  )
              return classes
          PY

      - name: Run tests
        run: python -m coverage run -m pytest

      - name: Enforce 95% coverage gate
        run: >-
          python -m coverage report
          --include="hooks.py,extensions/python/**"
          --show-missing
          --fail-under=95