<html>
<head>
  <title>RTK Savings</title>
</head>
<body>
  <div x-data
       x-init="$store.rtkGain.onOpen($el)"
       x-destroy="$store.rtkGain.cleanup()">

    <div x-show="$store.rtkGain.status === 'loading'">
      <p>Opening savings page&#8230;</p>
    </div>

    <div x-show="$store.rtkGain.status === 'error'">
      <p x-text="$store.rtkGain.error"></p>
    </div>

    <!-- ready state: either the headline view or a notice view -->
    <template x-if="$store.rtkGain.status === 'ready'">

      <template x-if="$store.rtkGain.renderView().view === 'headline'">
        <div class="rtk-gain-headline">
          <h1>RTK savings</h1>
          <p class="rtk-gain-headline-figure" x-text="$store.rtkGain.renderView().headline"></p>
          <dl class="rtk-gain-fields">
            <template x-for="field in $store.rtkGain.renderView().fields" :key="field.label">
              <div>
                <dt x-text="field.label"></dt>
                <dd x-text="field.value"></dd>
              </div>
            </template>
          </dl>
          <p class="rtk-gain-source-note">
            These are RTK's own accounting numbers, shown as RTK formats them.
          </p>
        </div>
      </template>

      <template x-if="$store.rtkGain.renderView().view === 'notice'">
        <div class="rtk-gain-notice">
          <h1>RTK savings</h1>
          <!-- static default copy is the empty-ledger state; x-text overrides
               it with the specific notice (missing rtk / endpoint fail) -->
          <p x-text="$store.rtkGain.renderView().notice">RTK has no tracked commands yet. Savings appear here once commands run through the plugin.</p>
        </div>
      </template>

    </template>

  </div>

  <script>
// RTK savings page store (slash-command surface, zero-load contract).
// Zero-load invariant: the ONLY entry point is onOpen (page open). No timers,
// no watchers, no polling, no background refresh - the single fetch below is
// issued exactly once per open and nowhere else.

// NOTE: top-level `var` (not `const`) is deliberate: A0 re-creates classic
// script nodes on every modal open (webui/js/components.js non-module branch,
// uncached) while module scripts are URL-cached there - a top-level const would
// throw a redeclaration SyntaxError on the second open. Bundled precedents
// (_whats_new, _kokoro_tts) use module scripts instead; this shell keeps the
// classic-script shape its node test harness drives.

// Bounded lifecycle log: repeated open/destroy mounts must not grow it forever
// (events[] discipline). 64 entries is far beyond any diagnostic need.
// The POST target of the savings endpoint is derived from this page's own
// modal path (the framework stamps every modal element with a data-modal-path
// attribute holding its route). No plugin directory name is baked into this
// document, so one shipped page serves every installed directory name.
function rtkGainEndpointForModalPath(modalPath) {
  const match = /^\/plugins\/([^/]+)\//.exec(String(modalPath || ""));
  if (!match) return "";
  return "/api/plugins/" + match[1] + "/rtk_gain";
}

function rtkGainEndpointFromElement($el) {
  const modal = $el && typeof $el.closest === "function"
    ? $el.closest(".modal[data-modal-path]")
    : null;
  if (!modal) return "";
  return rtkGainEndpointForModalPath(modal.dataset && modal.dataset.modalPath);
}

// Bounded lifecycle log: repeated open/destroy mounts must not grow it forever
// (events[] discipline). 64 entries is far beyond any diagnostic need.
var RTK_GAIN_EVENTS_MAX = 64;

// Friendly copy for the notice states (the endpoint answers structured bodies;
// raw reason strings never reach the user - consumed at this layer).
var RTK_GAIN_NOTICES = {
  "rtk-missing":
    "The RTK binary was not found on PATH, so there are no savings to show " +
    "yet. Re-run setup from the plugin directory to provision it - see the " +
    "Troubleshooting section of the README.",
  "timeout":
    "RTK did not answer in time, so the summary could not be read. RTK's own " +
    "accounting is unchanged - try opening the page again.",
  "spawn-failed":
    "RTK could not be started, so the summary could not be read. Try opening " +
    "the page again - see the README Troubleshooting section if it repeats.",
  "nonzero-exit":
    "RTK exited with an error this time, so the summary could not be read. " +
    "RTK's own accounting is unchanged - try opening the page again.",
  "unparseable-output":
    "RTK's output could not be read in a known format. RTK's own accounting " +
    "is unchanged - try opening the page again.",
  "unexpected-error":
    "The savings summary could not be read this time. Agent Zero and RTK are " +
    "unaffected - try opening the page again.",
};

var createRtkGainStore = () => ({
  status: "idle", // idle | loading | ready | error
  notice: "", // friendly copy for the ready-but-nothing-to-show states
  message: "", // RTK's own headline string (endpoint-provided, verbatim)
  error: "", // network-level failure text (error state, not a notice)
  view: { view: "loading" }, // render projection for the page
  summary: null, // endpoint summary (rendered as-is, never recomputed)
  source: "none", // json | text (which parse produced the summary)
  events: [], // bounded lifecycle log
  _mount: 0, // monotonic mount generation (stale-response guard)

  onOpen($el) {
    // the page-open lifecycle hands its own element; the endpoint target
    // is derived from the modal path that element lives in. When no modal
    // ancestor is resolvable the surface fails visibly (error state) -
    // never a silent no-op and never a baked-in fallback name.
    if (this.status !== "idle") return;
    // review patch: enter loading BEFORE the derivation so a
    // derivation failure lands in the visible error state. fail() only
    // advances from loading, so calling it from idle would no-op and
    // strand the page on a blank view (the defect this fixes).
    this.status = "loading";
    this._emit("open");
    this._emit("status", "idle", "loading");
    const endpoint = rtkGainEndpointFromElement($el);
    if (!endpoint) {
      this.fail("savings page could not resolve its endpoint");
      return;
    }
    if (typeof fetch !== "function") {
      this.fail("endpoint client unavailable in this runtime");
      return;
    }
    // mount generation: cleanup() bumps this token so a response from a
    // torn-down mount can never write into a fresh one
    const mount = ++this._mount;
    this._inflight = fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    })
      .then((response) => response.json())
      .then((data) => {
        // stale-write guard: only this mount's response may drive state
        if (mount !== this._mount) return;
        this.handle(data);
      })
      .catch(() => {
        // network-level failure - distinct from endpoint notice states
        if (mount !== this._mount) return;
        this.fail("savings summary could not be fetched");
      });
    // the chain itself: awaited by the open lifecycle so the page renders
    // after the response lands (node harness scenario contract)
    return this._inflight;
  },

  handle(data) {
    // consume the endpoint contract: ok+summary -> headline/empty-ledger,
    // anything else -> a friendly notice (never raw error chrome).
    // a response from a torn-down mount (or any non-loading state) is
    // dropped here - the machine only advances from loading
    if (this.status !== "loading") return;
    if (data && data.ok === true && data.summary) {
      this.summary = data.summary;
      this.source = String(data.source || "json");
      this.message = String(data.message || "RTK savings available");
      this.notice = "";
      this.status = "ready";
      this._emit("status", "loading", "ready");
      return "ready";
    }
    const reason = String((data && data.error) || "").split(":")[0].trim();
    if (data && data.rtk_available === false) {
      this.notice = RTK_GAIN_NOTICES["rtk-missing"];
    } else if (RTK_GAIN_NOTICES[reason]) {
      this.notice = RTK_GAIN_NOTICES[reason];
    } else {
      this.notice = RTK_GAIN_NOTICES["unexpected-error"];
    }
    this.summary = null;
    this.status = "ready";
    this._emit("status", "loading", "ready");
    return "notice";
  },

  complete() {
    // test/transition seam: fetch-less resolution of the loading state
    if (this.status !== "loading") return;
    this.status = "ready";
    this._emit("status", "loading", "ready");
  },

  fail(message) {
    if (this.status !== "loading") return;
    this.status = "error";
    this.error = String(message || "unknown error");
    this._emit("status", "loading", "error");
  },

  renderView() {
    // pure projection of state -> what the page renders. The headline is the
    // endpoint's own string verbatim; pct gets ONE display format and is
    // never recomputed from counts; supporting fields are display-level
    // humanization only. Non-finite/non-numeric values render as "n/a".
    if (this.status !== "ready") {
      if (this.status === "error") return { view: "error", error: this.error };
      return { view: "loading" };
    }
    const summary = this.summary || {};
    // n/a for anything that is not a finite number; a string keeps its
    // verbatim value (RTK's own text formatting) but NaN/Infinity/booleans
    // never surface as page literals
    const num = (v) => typeof v === "number" && isFinite(v);
    const group = (v) => {
      if (typeof v === "number") return isFinite(v) ? v.toLocaleString("en-US") : "n/a";
      if (typeof v === "boolean" || v == null) return "n/a";
      return String(v);
    };
    // a specific fail-state notice always wins over any data-driven state
    if (this.notice) return { view: "notice", notice: this.notice };
    // no numeric activity at all (empty object, missing counters, or
    // all-zero) is a distinct friendly state, not a headline of n/a fields
    if (
      !summary ||
      typeof summary.total_commands !== "number" ||
      Number(summary.total_commands) === 0 ||
      Number(summary.total_input) === 0
    ) {
      return {
        view: "notice",
        notice:
          "RTK has no tracked commands yet. Savings appear here once " +
          "commands run through the plugin - the numbers come from RTK's " +
          "own accounting.",
      };
    }
    const fields = [];
    if (this.source === "text") {
      // text-fallback fields render RTK's parsed strings as-is
      fields.push({ label: "Tokens saved", value: String(summary.saved_text || "n/a") });
      fields.push({
        label: "Avg savings",
        value: num(summary.savings_pct_text) ? summary.savings_pct_text.toFixed(1) + "%" : "n/a",
      });
      fields.push({ label: "Total commands", value: group(summary.total_commands) });
      if (summary.input_text != null)
        fields.push({ label: "Input tokens", value: String(summary.input_text) });
      if (summary.output_text != null)
        fields.push({ label: "Output tokens", value: String(summary.output_text) });
      if (summary.exec_time_text != null)
        fields.push({ label: "Exec time", value: String(summary.exec_time_text) });
      if (summary.oversized_excluded != null)
        fields.push({ label: "Excluded (oversized)", value: group(summary.oversized_excluded) });
    } else {
      // json source: raw numeric fields, display-level humanization only
      fields.push({ label: "Tokens saved", value: group(summary.total_saved) });
      fields.push({
        label: "Avg savings",
        value: num(summary.avg_savings_pct) ? summary.avg_savings_pct.toFixed(1) + "%" : "n/a",
      });
      fields.push({ label: "Total commands", value: group(summary.total_commands) });
      fields.push({ label: "Input tokens", value: group(summary.total_input) });
      fields.push({ label: "Output tokens", value: group(summary.total_output) });
      fields.push({
        label: "Exec time",
        value: num(summary.total_time_ms) ? (summary.total_time_ms / 1000).toFixed(1) + " s" : "n/a",
      });
      fields.push({ label: "Excluded (oversized)", value: group(summary.oversized_excluded) });
    }
    return { view: "headline", headline: this.message || "RTK savings available", fields };
  },

  _emit(type, from, to) {
    const entry = to === undefined ? { type } : { type, from, to };
    this.events.push(entry);
    if (this.events.length > RTK_GAIN_EVENTS_MAX) this.events.shift();
  },

  cleanup() {
    // x-destroy teardown: a fresh mount starts from a clean machine.
    // review patch: the mount generation is bumped here as well
    // as in onOpen, so an in-flight response from a torn-down mount can
    // never write into a fresh one (defense-in-depth alongside the
    // loading-state guards in handle()/fail()).
    this.status = "idle";
    this.notice = "";
    this.message = "";
    this.error = "";
    this.view = { view: "loading" };
    this.summary = null;
    this.source = "none";
    this.events = [];
    this._mount += 1;
  },
});

globalThis.createRtkGainStore = createRtkGainStore;

var _rtkGainStore = createRtkGainStore();
// Registration: register now when Alpine already exists (browser main-document
// or node harness), otherwise wait for alpine:init. The listener branch is
// guarded because the store file also runs inside a plain node vm sandbox,
// where no document exists - registering there must not throw.
if (typeof Alpine !== "undefined" && Alpine.store) {
  Alpine.store("rtkGain", _rtkGainStore);
} else if (typeof document !== "undefined" && document.addEventListener) {
  document.addEventListener("alpine:init", () => Alpine.store("rtkGain", _rtkGainStore));
}
</script>
</body>
</html>
